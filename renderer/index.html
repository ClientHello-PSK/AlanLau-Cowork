<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTS Cowork</title>
  <!-- CSS Modules -->
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/leftSidebar.css">
  <link rel="stylesheet" href="styles/homeView.css">
  <link rel="stylesheet" href="styles/chatView.css">
  <link rel="stylesheet" href="styles/input.css">
  <link rel="stylesheet" href="styles/messageContent.css">
  <link rel="stylesheet" href="styles/rightPanel.css">
  <link rel="stylesheet" href="styles/settings.css">
  <link rel="stylesheet" href="styles/skills.css">
  <link rel="stylesheet" href="styles/utilities.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Left Sidebar - Chat History -->
    <aside class="left-sidebar" id="leftSidebar">
      <div class="left-sidebar-header">
        <button class="new-chat-sidebar-btn" onclick="startNewChat()" title="New chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New Chat</span>
        </button>
      </div>
      <!-- Chat Search -->
      <div class="chat-search-container">
        <input
          type="text"
          id="chatSearch"
          class="chat-search-input"
          placeholder="搜索聊天历史..."
          aria-label="Search chat history"
        />
      </div>
      <div class="chat-history-list" id="chatHistoryList">
        <!-- Chat history items will be added here -->
      </div>

      <!-- Theme Toggle -->
      <div class="theme-toggle-container">
        <button id="themeToggleBtn" class="settings-btn" title="Toggle theme">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span>Light Mode</span>
        </button>
      </div>

      <!-- Settings Button -->
      <div class="settings-container">
        <button id="settingsBtn" class="settings-btn" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Settings</span>
        </button>
      </div>
    </aside>
    <div class="resizer horizontal" id="leftResizer"></div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Home View (shown when no messages) -->
      <div class="home-view" id="homeView">
      <div class="greeting-section">
        <div class="greeting">
          <h1 class="greeting-text">GTS Cowork</h1>
          <p class="tagline">Powered by AI Engineering Dept</p>
        </div>
      </div>

      <!-- Quick Start Templates -->
      <div class="quick-start-templates" id="quickStartTemplates">
        <div class="templates-header">
          <h2>快速开始</h2>
          <p>选择一个模板开始对话</p>
        </div>
        <div class="templates-grid">
          <!-- 第一行 -->
          <!-- 1. 跨厂商配置翻译 - NIS -->
          <button class="template-card" data-template="config-translate">
            <span class="domain-tag nis">NIS</span>
            <div class="template-icon">🔄</div>
            <div class="template-title">跨厂商配置翻译</div>
            <div class="template-desc">旧网/异构网配置导出，翻译成目标脚本，自动勾稽差异</div>
          </button>

          <!-- 2. LLD实时校准 - NIS -->
          <button class="template-card" data-template="lld-calibration">
            <span class="domain-tag nis">NIS</span>
            <div class="template-icon">📐</div>
            <div class="template-title">LLD实时校准</div>
            <div class="template-desc">详细设计与现网数据对比，实时识别资源冲突，避免回滚</div>
          </button>

          <!-- 3. 验收件自动纠错 - SEC -->
          <button class="template-card" data-template="pac-review">
            <span class="domain-tag sec">SEC</span>
            <div class="template-icon">✅</div>
            <div class="template-title">验收件自动纠错</div>
            <div class="template-desc">PAC/FAC截图自动审核，比对合同要求，标记不合格项</div>
          </button>

          <!-- 第二行 -->
          <!-- 4. 故障证据链梳理 - AMS -->
          <button class="template-card" data-template="fault-evidence">
            <span class="domain-tag ams">AMS</span>
            <div class="template-icon">🔍</div>
            <div class="template-title">故障证据链梳理</div>
            <div class="template-desc">多源日志/邮件自动整合，生成时间轴与根因推测草稿</div>
          </button>

          <!-- 5. SOC规范应答 - 交付 -->
          <button class="template-card" data-template="soc-response">
            <span class="domain-tag delivery">交付</span>
            <div class="template-icon">📋</div>
            <div class="template-title">SOC规范应答</div>
            <div class="template-desc">投标技术规范书逐条判断，快速生成应答初稿供专家审核</div>
          </button>

          <!-- 6. 分包商影子审计 - SEC -->
          <button class="template-card" data-template="subcon-audit">
            <span class="domain-tag sec">SEC</span>
            <div class="template-icon">👁️</div>
            <div class="template-title">分包商影子审计</div>
            <div class="template-desc">全量扫描分包商操作日志，自动抓取违规操作如跳步执行</div>
          </button>
        </div>
      </div>

      <div class="input-container home-input">
        <form id="homeForm" class="input-form">
          <div class="input-wrapper">
            <textarea
              id="homeInput"
              class="message-textarea"
              placeholder="Ask me anything (Shift+Enter for new line)"
              rows="1"
            ></textarea>
            <div class="input-controls">
              <div class="left-controls">
                <input type="file" id="homeFileInput" class="file-input-hidden" multiple />
                <button type="button" class="control-btn attach-btn" id="homeAttachBtn" title="Attach file">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
                <button type="button" class="control-btn thinking-btn" id="homeThinkingBtn" title="Extended thinking ⇧⌘E">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>
                </button>
              </div>
              <div class="right-controls">
                <!-- Stop Button (hidden by default) -->
                <button type="button" class="stop-btn" id="homeStopBtn" style="display: none;">
                  <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                  </svg>
                  <span>Stop</span>
                </button>
                <!-- Model Selector -->
                <select id="homeModelSelect" class="model-select">
                  <option value="deepseek-v4-flash" selected>DeepSeek V4 Flash</option>
                  <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                </select>
                <button type="submit" class="send-btn" id="homeSendBtn" disabled>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Chat View (shown when there are messages) -->
    <div class="chat-view hidden" id="chatView">
      <div class="chat-main">
        <header class="chat-header">
          <button class="chat-title-btn">
            <span id="chatTitle">New chat</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <button class="sidebar-expand-btn" id="sidebarExpandBtn" onclick="toggleSidebar()" title="展开侧边栏" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </header>

        <div class="messages-container" id="chatMessages">
          <!-- Messages will be added here dynamically -->
        </div>

        <div class="chat-input-wrapper">
          <div class="input-container">
            <form id="chatForm" class="input-form">
              <div class="input-wrapper">
                <textarea
                  id="messageInput"
                  class="message-textarea"
                  placeholder="Reply... (Shift+Enter for new line)"
                  rows="1"
                ></textarea>
                <div class="input-controls">
                  <div class="left-controls">
                    <input type="file" id="chatFileInput" class="file-input-hidden" multiple />
                    <button type="button" class="control-btn attach-btn" id="chatAttachBtn" title="Attach file">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                      </svg>
                    </button>
                    <button type="button" class="control-btn thinking-btn" id="chatThinkingBtn" title="Extended thinking ⇧⌘E">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                      </svg>
                    </button>
                  </div>
                  <div class="right-controls">
                    <!-- Stop Button (hidden by default) -->
                    <button type="button" class="stop-btn" id="chatStopBtn" style="display: none;">
                      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
                        <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                      </svg>
                      <span>Stop</span>
                    </button>
                    <!-- Model Selector -->
                    <select id="chatModelSelect" class="model-select">
                      <option value="deepseek-v4-flash" selected>DeepSeek V4 Flash</option>
                      <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                    </select>
                    <button type="submit" class="send-btn" id="chatSendBtn" disabled>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <p class="disclaimer">AI的回答未必正确无误，请注意核查</p>
        </div>
      </div>
      <div class="resizer horizontal" id="rightResizer"></div>

      <!-- Right Panel with Tabs -->
      <aside class="right-panel" id="sidebar">
        <!-- Panel Header -->
        <div class="panel-header">
          <h3>Agent执行过程</h3>
          <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>

        <!-- Tab Navigation -->
        <div class="panel-tabs">
          <button class="panel-tab active" data-tab="timeline" onclick="window.switchPanelTab('timeline')">时间线</button>
          <button class="panel-tab" data-tab="files" onclick="window.switchPanelTab('files')">文件变更</button>
        </div>

        <!-- Tab Content -->
        <div class="panel-content">
          <!-- Timeline Tab (Unified Progress & Tools) -->
          <div class="tab-pane active" id="tab-timeline">
            <div class="timeline-list" id="timelineList">
              <!-- Timeline items will be added here -->
              <div class="empty-state" id="emptyTimeline">暂无执行记录</div>
            </div>
          </div>

          <!-- Files Tab -->
          <div class="tab-pane" id="tab-files">
            <div class="file-changes-list" id="fileChangesList">
              <!-- File changes will be added here -->
              <div class="empty-state" id="emptyFiles">暂无文件变更</div>
            </div>
          </div>
        </div>
      </aside>
    </div>
    </div><!-- end main-content -->
  </div>

  <script type="module" src="renderer.js"></script>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal modal-large">
      <div class="modal-header">
        <h2>系统设置</h2>
        <button id="closeSettingsBtn" class="modal-close-btn">&times;</button>
      </div>
      
      <!-- Settings Tabs -->
      <div class="settings-tabs">
        <button class="settings-tab active" data-tab="general" onclick="switchSettingsTab('general')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          常规设置
        </button>
        <button class="settings-tab" data-tab="skills" onclick="switchSettingsTab('skills')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          技能管理
        </button>
      </div>
      
      <div class="modal-body">
        <!-- General Settings Tab -->
        <div class="settings-tab-content active" id="settingsTab-general">
        <!-- Workspace Directory Card -->
        <div class="settings-card">
          <div class="settings-card-header">
            <h3>
              <span>工作目录</span>
              <span class="card-badge">文件操作范围</span>
            </h3>
          </div>
          <div class="settings-card-body">
            <div class="workspace-input-wrapper">
              <input type="text" id="workspaceDir" placeholder="D:\Projects\my-workspace" />
              <button type="button" id="browseWorkspaceBtn" class="browse-btn" title="浏览选择目录">📁</button>
            </div>
            <p class="input-hint">Agent 的文件操作将被限制在此目录内，确保系统安全</p>
            <div class="sandbox-toggle-wrapper">
              <label class="sandbox-toggle-label">
                <div>
                  <div class="sandbox-toggle-label-text">启用文件沙箱保护</div>
                  <div class="sandbox-toggle-label-desc">限制文件操作在指定目录内，防止误操作</div>
                </div>
                <div style="display: flex; align-items: center;">
                  <label class="toggle-switch">
                    <input type="checkbox" id="sandboxEnabled" checked />
                    <span class="toggle-slider"></span>
                  </label>
                  <span class="sandbox-status active" id="sandboxStatus">已启用</span>
                </div>
              </label>
            </div>
          </div>
        </div>

        <!-- System Diagnosis Card -->
        <div class="settings-card">
          <div class="settings-card-header">
            <h3>系统诊断</h3>
            <button type="button" id="diagnoseBtn" class="diagnose-btn">运行诊断</button>
          </div>
          <div class="settings-card-body">
            <div id="diagnoseResult" class="diagnose-cards hidden">
              <!-- 诊断结果将动态渲染 -->
            </div>
            <p class="input-hint" style="margin-top: 0;">检查系统连接状态和配置是否正确</p>
          </div>
        </div>
        </div><!-- end settingsTab-general -->
        
        <!-- Skills Tab -->
        <div class="settings-tab-content" id="settingsTab-skills">
          <!-- Skills Header -->
          <div class="skills-header">
            <div class="skills-header-left">
              <h3>已安装技能</h3>
              <span class="skills-count" id="skillsCount">0 个技能</span>
            </div>
            <button class="btn btn-primary btn-sm" id="createSkillBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              创建技能
            </button>
          </div>
          
          <!-- Skills Filter -->
          <div class="skills-filter">
            <div class="skills-search">
              <input type="text" id="skillsSearch" placeholder="搜索技能..." />
            </div>
            <div class="skills-source-filter">
              <select id="skillsSourceFilter">
                <option value="all">全部来源</option>
                <option value="local">本地技能</option>
                <option value="claude-code">Claude Code</option>
              </select>
            </div>
          </div>
          
          <!-- Skills List -->
          <div class="skills-list" id="skillsList">
            <div class="skills-loading">
              <div class="loading-spinner"></div>
              <span>加载技能列表...</span>
            </div>
          </div>
          
          <!-- Claude Code Compat Toggle -->
          <div class="settings-card" style="margin-top: 16px;">
            <div class="settings-card-header">
              <h3>Claude Code 兼容</h3>
            </div>
            <div class="settings-card-body">
              <label class="sandbox-toggle-label">
                <div>
                  <div class="sandbox-toggle-label-text">自动扫描 Claude Code 插件</div>
                  <div class="sandbox-toggle-label-desc">从 ~/.claude/plugins/ 加载已安装的技能</div>
                </div>
                <label class="toggle-switch">
                  <input type="checkbox" id="claudeCodeEnabled" checked />
                  <span class="toggle-slider"></span>
                </label>
              </label>
            </div>
          </div>
        </div><!-- end settingsTab-skills -->
      </div>
      <div class="modal-footer">
        <button id="resetSettingsBtn" class="btn btn-secondary">恢复默认</button>
        <button id="saveSettingsBtn" class="btn btn-primary">保存设置</button>
      </div>
    </div>
  </div>
  <!-- Create Skill Modal -->
  <div id="createSkillModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>创建本地技能</h2>
        <button class="modal-close-btn" onclick="closeCreateSkillModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="newSkillName">技能名称</label>
          <input type="text" id="newSkillName" placeholder="my-skill" pattern="[a-zA-Z0-9_-]+" />
          <p class="input-hint">仅支持字母、数字、下划线和连字符</p>
        </div>
        <div class="form-group">
          <label for="newSkillContent">SKILL.md 内容</label>
          <textarea id="newSkillContent" rows="12" placeholder="---
name: my-skill
description: 技能描述
---

# 技能名称

## Overview
技能的用途说明

## When to Use
何时使用此技能

## Instructions
具体指令内容"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeCreateSkillModal()">取消</button>
        <button class="btn btn-primary" id="confirmCreateSkillBtn">创建技能</button>
      </div>
    </div>
  </div>

  <!-- Skill Detail Modal -->
  <div id="skillDetailModal" class="modal-overlay hidden">
    <div class="modal modal-large">
      <div class="modal-header">
        <h2 id="skillDetailTitle">技能详情</h2>
